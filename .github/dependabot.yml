version: 2

# Nothing else in this repo will ever mention that a new version exists. The
# site sat on next@16.2.3 with a fixed patch (16.2.10) available and no way to
# find out short of running `npm outdated` by hand.
#
# Grouped and weekly on purpose: the point is one reviewable PR to glance at,
# not a stream of them. Every PR still has to clear lint + unit + e2e + build
# before it can reach production, so a bad bump fails in CI rather than on the
# live site.
#
# Note for whoever reads a Dependabot security alert here: do NOT run
# `npm audit fix --force`. npm "fixes" a transitive postcss advisory by
# installing next@9.3.3 — a downgrade from 16 that would destroy the app.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # next + eslint-config-next are pinned exactly and must move together.
      next:
        patterns:
          - next
          - eslint-config-next
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
