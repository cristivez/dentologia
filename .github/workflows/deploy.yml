name: CI/CD

on:
  push:
    branches: [main, v2site]
  # v2site is what actually serves dentologia.ro; main is the old static site,
  # frozen. Gating only PRs into main meant a PR into production ran no checks
  # at all, while the branch nobody deploys was fully guarded.
  pull_request:
    branches: [main, v2site]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; the deploy job widens this for itself.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # All three engines. chromium (desktop) + webkit (the `mobile` project,
      # devices["iPhone 14"]) + no-js (chromium, prerendered HTML with JS off —
      # the regression class of the loading.tsx incident). On a mobile-first
      # clinic site the mobile engine belongs in the gate. webkit installs
      # cleanly here (Linux, Node 22); the extraction hang that blocks a plain
      # `playwright install webkit` is a local Node-26 issue, not a CI one.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Must precede the build: actions/cache restores at the step's position,
      # so sitting after `npm run build` it never once warmed the build it
      # exists to speed up. It saves on job success, hence still before.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: nextjs-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      # The repo has no Cloudflare secrets configured — production has so far
      # been deployed locally (npx opennextjs-cloudflare deploy, wrangler
      # OAuth). Skip cleanly instead of failing every main push; adding
      # CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID as repo secrets activates
      # CI deploys with no other change.
      - id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN secret is not set. Deploy locally with 'npm run deploy', or add the Cloudflare repo secrets to enable CI deploys."
          fi
      - if: steps.creds.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.creds.outputs.present == 'true'
        run: npm ci
      # The Cloudflare Web Analytics token is a public value baked into
      # CloudflareAnalytics.tsx, so no secret is needed for it.
      - if: steps.creds.outputs.present == 'true'
        run: npx opennextjs-cloudflare build
      # opennextjs-cloudflare deploy, NOT bare wrangler deploy: it populates
      # the incremental cache first. Without it every prerendered dynamic
      # route (/servicii/[slug], /preturi/[slug], /blog/[slug]) 404s.
      - if: steps.creds.outputs.present == 'true'
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
