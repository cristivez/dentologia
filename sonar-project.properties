# SonarQube — Dentologia
# Local Community instance: http://localhost:9000 (Docker container "sonarqube")
# Run analysis: npm run sonar   (needs SONAR_TOKEN in the environment)

sonar.projectKey=dentologia
sonar.projectName=Dentologia
sonar.host.url=http://localhost:9000
# sonar.token is passed at runtime via the SONAR_TOKEN env var — never commit a token here.

# ── Sources ──────────────────────────────────────────────────────────────────
# Product code only. Tests are indexed as tests (not analysed as product code),
# so test-only smells don't count against the project. worker.ts is the
# Worker entry and lives at the root.
sonar.sources=src,scripts,worker.ts
sonar.tests=tests
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/.open-next/**,\
  **/.wrangler/**

sonar.typescript.tsconfigPaths=tsconfig.json

# No coverage report yet: the unit suite runs without a coverage provider
# (@vitest/coverage-v8 is not installed). Add it and point
# sonar.javascript.lcov.reportPaths at coverage/lcov.info when coverage matters.
